[package]
name = "soul-agent-launcher"
version = "0.2.2"
description = "Soul Agent Launcher - 启动与管理 llama.cpp 服务"
authors = ["Your Name"]
edition = "2021"

[[bin]]
name = "soul-agent-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "blocking"] }
zip = "2"
tiny_http = "0.12"
